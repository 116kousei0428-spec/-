<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101317" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="野球ハンデ" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>野球ハンデ精算</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">BASEBALL HANDICAP</div>
        <h1>野球ハンデ精算</h1>
        <div id="syncStatus" class="sync-status connecting">共通データ接続中…</div>
      </div>
      <button id="installBtn" class="ghost-btn hidden">アプリ追加</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button data-route="today" class="nav-btn active"><span>今日</span></button>
      <button data-route="new" class="nav-btn"><span>試合登録</span></button>
      <button data-route="settlement" class="nav-btn"><span>精算</span></button>
      <button data-route="history" class="nav-btn"><span>履歴</span></button>
      <button data-route="settings" class="nav-btn"><span>設定</span></button>
    </nav>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card" id="modalBody"></form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="./app.js?v=7"></script>
</body>
</html>
